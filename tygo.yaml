# tygo generates frontend/src/types.ts from the Go response structs, so the
# TypeScript and the JSON cannot drift. Edit the Go structs, run `make types`,
# never hand-edit types.ts.
packages:
  - path: "github.com/bborbe/vault-ui/pkg/api"
    output_path: "frontend/src/types.ts"
    type_mappings:
      # time.Time serialises to an RFC3339 string.
      time.Time: "string"
    frontmatter: |
      // Code generated by tygo from pkg/api. DO NOT EDIT.
